services:
  - type: web
    name: ezone-server
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /v1/health
    envVars:
      # REQUIRED for production: without these, Render generates fresh
      # random keys on every deploy/restart, invalidating every session and
      # magic link, and breaking horizontal scaling (each instance would use
      # different keys). Generate once by deploying with these unset, copy
      # the three EZONE_* lines the service prints to its logs, then set
      # them here (sync: false means Render prompts you to fill them in and
      # keeps them out of this committed file).
      - key: EZONE_HMAC_KEY
        sync: false
      - key: EZONE_TOKEN_PRIVATE_KEY
        sync: false
      - key: EZONE_TOKEN_PUBLIC_KEY
        sync: false
      # Include ?connect_timeout=5 (seconds) in the value -- libpq has no
      # default, so a reconnect attempt during a Postgres outage can
      # otherwise hang far longer before giving up.
      - key: EZONE_DATABASE_URL
        sync: false
      - key: EZONE_DB_POOL_SIZE
        value: "4"
      - key: EZONE_PORT
        value: "8080"
      - key: EZONE_THREADS
        value: "4"
      - key: EZONE_EMAIL_PROVIDER
        value: resend
      - key: EZONE_RESEND_API_KEY
        sync: false
      - key: EZONE_EMAIL_FROM
        value: "ezone <positiveminds256@gmail.com>"
      - key: EZONE_RATE_LIMIT
        value: "60"
      - key: EZONE_APP_URL
        sync: false
      - key: EZONE_CORS_ORIGIN
        sync: false
      # Render terminates TLS and proxies to this service — its own
      # X-Forwarded-For can be trusted for rate limiting / QR IP-binding.
      - key: EZONE_TRUST_PROXY
        value: "true"
      # Distributed rate limiting (optional) -- set EZONE_REDIS_HOST if you
      # add a Render Key Value (Redis-compatible) instance and scale this
      # service to more than one instance, so the rate limit is shared
      # instead of each instance enforcing its own independent limit. Leave
      # unset for a single-instance deployment.
      - key: EZONE_REDIS_HOST
        sync: false
      - key: EZONE_REDIS_PORT
        value: "6379"
      - key: EZONE_REDIS_PASSWORD
        sync: false
      # Which auth methods to expose: "all", or a comma-separated list (see
      # .env.example). Defaults to challenge+magic_link+recovery if unset.
      - key: EZONE_ENABLED_METHODS
        sync: false
      - key: EZONE_WEBAUTHN_RP_ID
        sync: false
      - key: EZONE_WEBAUTHN_RP_NAME
        sync: false
