name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── C++ core: build + test ───────────────────────────────────────────────────
  # Builds the REST server (EZONE_BUILD_SERVER=ON) on every OS so the server
  # layer is actually compiled in CI, not just the SDK library — the server
  # has its own dependency (cpp-httplib) and compile-definition wiring that
  # can break independently of the SDK.
  cpp:
    name: C++ (${{ matrix.os }}, libsodium=${{ matrix.libsodium }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        libsodium: [false]
        include:
          # Also cover the EZONE_USE_LIBSODIUM=ON code path — it's a
          # significant chunk of crypto_engine.cpp that's otherwise never
          # compiled, and has broken silently before (see CHANGELOG).
          - os: ubuntu-22.04
            libsodium: true

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake ninja-build
          if [ "${{ matrix.libsodium }}" = "true" ]; then sudo apt-get install -y libsodium-dev; fi

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3 cmake ninja

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DEZONE_BUILD_SERVER=ON \
            -DEZONE_USE_LIBSODIUM=${{ matrix.libsodium == true && 'ON' || 'OFF' }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DEZONE_BUILD_SERVER=ON `
            -DEZONE_USE_LIBSODIUM=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-libsodium-${{ matrix.libsodium }}
          path: build/Testing/

  # ── Node.js SDK ──────────────────────────────────────────────────────────────
  nodejs:
    name: Node.js SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/nodejs/package.json

      - name: Install
        working-directory: bindings/nodejs
        run: npm ci

      - name: Build
        working-directory: bindings/nodejs
        run: npm run build

      - name: Type check
        working-directory: bindings/nodejs
        run: npx tsc --noEmit

  # ── Browser SDK ──────────────────────────────────────────────────────────────
  browser:
    name: Browser SDK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/browser/package.json

      - name: Install
        working-directory: bindings/browser
        run: npm ci

      - name: Build
        working-directory: bindings/browser
        run: npm run build

  # ── Python SDK ───────────────────────────────────────────────────────────────
  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Import check
        working-directory: bindings/python
        run: python -c "from ezone import EzoneClient, EzoneError; print('OK')"

      - name: Build wheel
        working-directory: bindings/python
        run: pip install build && python -m build --wheel

  # ── Go SDK ───────────────────────────────────────────────────────────────────
  go:
    name: Go SDK (${{ matrix.go }})
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        go: ['1.22', '1.23']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: bindings/go/go.sum

      - name: Test
        working-directory: bindings/go
        run: go test ./... -v -race

      - name: Vet
        working-directory: bindings/go
        run: go vet ./...

  # ── Docs build ───────────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        run: npm run build

  # ── Distributed rate limiter (Redis) ────────────────────────────────────────
  # A real, running Redis, not a mock -- proves the shared-counter behavior
  # (and its fail-open-on-outage path) actually works, the same way this was
  # hand-verified in development: two independent server processes sharing
  # one Redis-backed limit must together allow only the configured cap, not
  # the cap per process.
  rate-limiter-redis:
    name: Rate limiter (Redis-backed)
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev cmake ninja-build

      - name: Configure + Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEZONE_BUILD_SERVER=ON -DEZONE_BUILD_TESTS=OFF
          cmake --build build

      - name: Start two replicas sharing one Redis-backed limit
        env:
          EZONE_ENABLED_METHODS: all
          EZONE_REDIS_HOST: localhost
          EZONE_RATE_LIMIT: "20"
        run: |
          EZONE_PORT=8080 ./build/rest/ezone-server > replicaA.log 2>&1 &
          EZONE_PORT=8081 ./build/rest/ezone-server > replicaB.log 2>&1 &
          sleep 2

      - name: Verify the limit is shared, not per-process
        run: |
          fire() {  # fire <port> <count> -- prints "allowed limited"
            local port=$1 n=$2 allowed=0 limited=0
            for i in $(seq 1 "$n"); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/v1/auth/qr/status?session_id=x")
              if [ "$code" = "429" ]; then limited=$((limited+1)); else allowed=$((allowed+1)); fi
            done
            echo "$allowed $limited"
          }
          read okA limA <<< "$(fire 8080 15)"
          echo "Replica A: allowed=$okA limited=$limA"
          read okB limB <<< "$(fire 8081 15)"
          echo "Replica B: allowed=$okB limited=$limB"
          total=$((okA + okB))
          echo "Total allowed across both replicas: $total (limit=20)"
          # A per-process-only limiter would allow up to 15+15=30; a shared
          # one cannot exceed the configured limit (20) no matter how the
          # 30 requests are split across replicas.
          if [ "$total" -gt 20 ]; then
            echo "FAIL: rate limit was not actually shared across replicas ($total allowed, expected <= 20)"
            cat replicaA.log replicaB.log
            exit 1
          fi
          if [ "$limA" -eq 0 ] && [ "$limB" -eq 0 ]; then
            echo "FAIL: no request was ever rate-limited -- the limiter isn't enforcing anything"
            exit 1
          fi
          echo "PASS: shared limit enforced across two independent processes"

  # ── SBOM ─────────────────────────────────────────────────────────────────────
  # A dependency inventory for every ecosystem this repo ships (npm x3, pip,
  # Go modules) so a newly-disclosed CVE can be checked against what's
  # actually shipped without re-deriving it from five different lockfiles by
  # hand. Runs on every push to main; the release workflow generates its own
  # copy attached to each tagged release.
  sbom:
    name: SBOM
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ezone-sdk.spdx.json
          upload-artifact: true
          artifact-name: sbom-spdx
